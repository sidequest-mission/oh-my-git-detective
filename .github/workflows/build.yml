name: "Build"

on:
  push:
    branches: [ "main", "master", "godot3_4_migration", "**" ]
    tags:
      - '*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  PROJECT_NAME: oh-my-git
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Get tag or branch name
        id: tag_name
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG_NAME=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: apt-get update && apt-get install -y rsync p7zip make

      - uses: actions/checkout@v4

      - name: Setup
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/$GODOT_VERSION.stable ~/.local/share/godot/export_templates/$GODOT_VERSION.stable

      - name: Build Linux
        run: make linux

      - name: Build macOS
        run: make macos

      - name: Build Windows
        run: make windows

      - name: Clean up
        run: make clean-unzipped

      - name: Deploy Linux (Itch.io)
        if: ${{ env.BUTLER_CREDENTIALS != '' }}
        uses: josephbmanley/butler-publish-itchio-action@v1.0.3
        env:
          CHANNEL: linux
          ITCH_GAME: ${{ env.PROJECT_NAME }}
          ITCH_USER: sidequest-mission
          PACKAGE: build/${{ env.PROJECT_NAME }}-linux.zip
          VERSION: ${{ steps.tag_name.outputs.TAG_NAME }}

      - name: Deploy macOS (Itch.io)
        if: ${{ env.BUTLER_CREDENTIALS != '' }}
        uses: josephbmanley/butler-publish-itchio-action@v1.0.3
        env:
          CHANNEL: osx
          ITCH_GAME: ${{ env.PROJECT_NAME }}
          ITCH_USER: sidequest-mission
          PACKAGE: build/${{ env.PROJECT_NAME }}-macos.zip
          VERSION: ${{ steps.tag_name.outputs.TAG_NAME }}

      - name: Deploy Windows (Itch.io)
        if: ${{ env.BUTLER_CREDENTIALS != '' }}
        uses: josephbmanley/butler-publish-itchio-action@v1.0.3
        env:
          CHANNEL: windows
          ITCH_GAME: ${{ env.PROJECT_NAME }}
          ITCH_USER: sidequest-mission
          PACKAGE: build/${{ env.PROJECT_NAME }}-windows.zip
          VERSION: ${{ steps.tag_name.outputs.TAG_NAME }}

