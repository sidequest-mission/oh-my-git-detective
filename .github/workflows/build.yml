name: "Build"

on:
  push:
    branches: [ "main", "master", "godot3_4_migration", "**" ]
    tags:
      - '*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  PROJECT_NAME: oh-my-git
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Get tag or branch name
        id: tag_name
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG_NAME=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            rsync p7zip make python3 \
            libfontconfig1 libx11-6 libxcursor1 libxext6 libxi6 libxinerama1 libxrandr2 libgl1 \
            libxkbcommon0 libwayland-cursor0 libwayland-client0 libwayland-egl1

      - uses: actions/checkout@v4

      - name: Setup
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/$GODOT_VERSION.stable ~/.local/share/godot/export_templates/$GODOT_VERSION.stable

      - name: Test level progression
        run: make test

      - name: Build Linux
        run: make linux

      - name: Test packaged menu navigation
        run: python3 tests/run_menu.py build/oh-my-git-linux/oh-my-git

      - name: Build macOS
        run: make macos

      - name: Build Windows
        run: make windows

      - name: Clean up
        run: make clean-unzipped

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-builds-${{ steps.tag_name.outputs.TAG_NAME }}
          path: |
            build/*.zip
          retention-days: 14

